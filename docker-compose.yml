# ============================================================
# VBank Microservices - Docker Compose
# ============================================================
# Profiles available:
#   (default)    - DBs + Service Registry (infrastructure only)
#   --profile services  - All microservice applications
#   --profile logging - Kafka + Kafbat UI
# ============================================================
# Usage:
#   docker compose up                                    # Infrastructure only
#   docker compose --profile services up                 # Services + infra
#   docker compose --profile logging up                # Kafka + infra
#   docker compose --profile all up                      # Everything
# ============================================================

services:
  # ========== Databases ==========
  user-db:
    image: postgres
    container_name: vbank-user-db
    environment:
      POSTGRES_DB: ${DB_USER_NAME:-user_db}
      POSTGRES_USER: ${DB_USER_USER:-user_user}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-user_pass}
    volumes: ["user_pgdata:/var/lib/postgresql"]
    ports: ["5051:5432"]

  account-db:
    image: postgres
    container_name: vbank-account-db
    environment:
      POSTGRES_DB: ${DB_ACCOUNT_NAME:-account_db}
      POSTGRES_USER: ${DB_ACCOUNT_USER:-account_user}
      POSTGRES_PASSWORD: ${DB_ACCOUNT_PASS:-account_pass}
    volumes: ["account_pgdata:/var/lib/postgresql"]
    ports: ["5050:5432"]

  transaction-db:
    image: postgres
    container_name: vbank-transaction-db
    environment:
      POSTGRES_DB: ${DB_TRANSACTION_NAME:-transaction_db}
      POSTGRES_USER: ${DB_TRANSACTION_USER:-transaction_user}
      POSTGRES_PASSWORD: ${DB_TRANSACTION_PASS:-transaction_pass}
    volumes: ["transaction_pgdata:/var/lib/postgresql"]

  logging-db:
    image: postgres
    container_name: vbank-logging-db
    environment:
      POSTGRES_DB: ${DB_LOGGING_NAME:-logging_db}
      POSTGRES_USER: ${DB_LOGGING_USER:-logging_user}
      POSTGRES_PASSWORD: ${DB_LOGGING_PASS:-logging_pass}
    volumes: ["logging_pgdata:/var/lib/postgresql"]

  # ========== Service Discovery ==========
  service-registry:
    build: ./services/service-registry
    container_name: vbank-service-registry
    ports: ["8761:${SERVER_PORT_REGISTRY:-8761}"]
    environment:
      EUREKA_HOST: service-registry
      EUREKA_PORT: 8761
      SERVER_PORT: ${SERVER_PORT_REGISTRY:-8761}

  # ========== Microservice Applications (profile: services) ==========
  account-service:
    build: ./services/account-service
    profiles: ["services", "all"]
    depends_on: [account-db, service-registry]
    ports: ["8081:${SERVER_PORT_ACCOUNT:-8080}"]
    environment:
      DB_HOST: ${DB_ACCOUNT_HOST:-account-db}
      DB_PORT: ${DB_ACCOUNT_PORT:-5432}
      DB_NAME: ${DB_ACCOUNT_NAME:-account_db}
      DB_USER: ${DB_ACCOUNT_USER:-account_user}
      DB_PASS: ${DB_ACCOUNT_PASS:-account_pass}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-server:9092}
      EUREKA_HOST: ${EUREKA_HOST:-service-registry}
      EUREKA_PORT: ${EUREKA_PORT:-8761}
      SERVER_PORT: ${SERVER_PORT_ACCOUNT:-8080}

  user-service:
    build: ./services/user-service
    profiles: ["services", "all"]
    depends_on: [user-db, service-registry]
    ports: ["8082:${SERVER_PORT_USER:-8088}"]
    environment:
      DB_HOST: ${DB_USER_HOST:-user-db}
      DB_PORT: ${DB_USER_PORT:-5432}
      DB_NAME: ${DB_USER_NAME:-user_db}
      DB_USER: ${DB_USER_USER:-user_user}
      DB_PASS: ${DB_USER_PASS:-user_pass}
      EUREKA_HOST: ${EUREKA_HOST:-service-registry}
      EUREKA_PORT: ${EUREKA_PORT:-8761}
      SERVER_PORT: ${SERVER_PORT_USER:-8088}

  transaction-service:
    build: ./services/transaction-service
    profiles: ["services", "all"]
    depends_on: [transaction-db, service-registry]
    ports: ["8083:${SERVER_PORT_TRANSACTION:-8089}"]
    environment:
      DB_HOST: ${DB_TRANSACTION_HOST:-transaction-db}
      DB_PORT: ${DB_TRANSACTION_PORT:-5432}
      DB_NAME: ${DB_TRANSACTION_NAME:-transaction_db}
      DB_USER: ${DB_TRANSACTION_USER:-transaction_user}
      DB_PASS: ${DB_TRANSACTION_PASS:-transaction_pass}
      EUREKA_HOST: ${EUREKA_HOST:-service-registry}
      EUREKA_PORT: ${EUREKA_PORT:-8761}
      SERVER_PORT: ${SERVER_PORT_TRANSACTION:-8089}

  logging-service:
    build: ./services/logging-service
    profiles: ["services", "all"]
    depends_on: [logging-db]
    ports: ["8084:${SERVER_PORT_LOGGING:-8080}"]
    environment:
      DB_HOST: ${DB_LOGGING_HOST:-logging-db}
      DB_PORT: ${DB_LOGGING_PORT:-5432}
      DB_NAME: ${DB_LOGGING_NAME:-logging_db}
      DB_USER: ${DB_LOGGING_USER:-logging_user}
      DB_PASS: ${DB_LOGGING_PASS:-logging_pass}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka-server:9092}
      EUREKA_HOST: ${EUREKA_HOST:-service-registry}
      EUREKA_PORT: ${EUREKA_PORT:-8761}
      SERVER_PORT: ${SERVER_PORT_LOGGING:-8080}

  # ========== Kafka (profile: logging) ==========
  kafka-server:
    image: apache/kafka:latest
    profiles: ["logging", "all"]
    container_name: vbank-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "xXFeO7HWRveirWAPPAKrGw"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafbat-ui:
    container_name: vbank-kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    profiles: ["logging", "all"]
    ports:
      - 8073:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: vbank
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
      SWAGGER_UI_ENABLED: 'true'
    volumes:
      - kafka-ui:/var/lib/kafka/ui

volumes:
  user_pgdata:
  account_pgdata:
  transaction_pgdata:
  logging_pgdata:
  kafka-data:
  kafka-ui: