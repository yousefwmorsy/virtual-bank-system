server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:account-db}:${DB_PORT:5432}/${DB_NAME:account_db}
    username: ${DB_USER:account_user}
    password: ${DB_PASS:account_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-server:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  logging:
    level:
      feign: DEBUG
      com.netflix.loadbalancer: DEBUG

account:
  number-generation-service:
    max-attempts: 10

eureka:
  instance:
    hostname: account-service
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:service-registry}:${EUREKA_PORT:8761}/eureka/