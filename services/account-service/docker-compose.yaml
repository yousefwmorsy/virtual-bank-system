version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_accountDB
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accountsDB
    ports:
      - "5438:5432"
    volumes:
      - pg_accounts_data:/var/lib/postgresql

  kafka-server:
    image: apache/kafka:latest
    container_name: vbank-kafka
    hostname: kafka
    ports:
      # Expose the EXTERNAL listener to your host machine
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Define three distinct listeners: Internal, External, and KRaft Controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:9093

      # Tell clients which address to use based on how they connect
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      # Map our custom listener names to the PLAINTEXT protocol
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      # Tell Kafka to use the INTERNAL listener for broker-to-broker traffic
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: "xXFeO7HWRveirWAPPAKrGw"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafbat-ui:
    container_name: kafbat-ui
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - 8073:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: vbank
      # Update to target the INTERNAL listener port we defined above
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
      SWAGGER_UI_ENABLED: 'true'
    volumes:
      - kafka-ui:/var/lib/kafka/ui

volumes:
  pg_accounts_data:
  kafka-data:
  kafka-ui: