version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres_loggingDB
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: loggingDB
    ports:
      - "5440:5432"
    volumes:
      - pg_logging_data:/var/lib/postgresql

volumes:
  pg_logging_data: