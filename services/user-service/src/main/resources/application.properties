spring.application.name=user-service
spring.docker.compose.enabled=false
server.port=${SERVER_PORT:8088}
spring.datasource.url=jdbc:postgresql://${DB_HOST:user-db}:${DB_PORT:5432}/${DB_NAME:user_db}

spring.datasource.username=${DB_USER:user_user}
spring.datasource.password=${DB_PASS:user_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.instance.hostname=user-service
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:service-registry}:${EUREKA_PORT:8761}/eureka/
