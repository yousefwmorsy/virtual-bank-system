spring.application.name=user-service
spring.docker.compose.enabled=false
server.port=${SERVER_PORT:8088}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:userDB}

spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

eureka.instance.hostname=user-service
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

jwt.issuer= vbank-user-service
jwt.audience= vbank-client
jwt.expiration-minutes= 15
jwt.key-id= user-service-key-1

wso2.client-mapping={portal:'portal-app-client', mobile:'mobile-app-client'}